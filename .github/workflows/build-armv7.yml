
name: Build CouchFi ARMv7

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK and NDK
        run: |
          sdkmanager --version
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Enable ARMv7
        run: |
          sed -i 's/abiFilters += listOf("arm64-v8a")/abiFilters += listOf("armeabi-v7a")/' app/build.gradle.kts
          grep abiFilters app/build.gradle.kts
          grep -q 'abiFilters += listOf("armeabi-v7a")' app/build.gradle.kts
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Build ARMv7 libusb
        run: |
          ROOT="$PWD"
          TOOLCHAIN="$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64"

          curl -fL https://github.com/libusb/libusb/releases/download/v1.0.27/libusb-1.0.27.tar.bz2 -o /tmp/libusb.tar.bz2

          tar -xjf /tmp/libusb.tar.bz2 -C /tmp
          cd /tmp/libusb-1.0.27

          export CC="$TOOLCHAIN/bin/armv7a-linux-androideabi26-clang"
          export AR="$TOOLCHAIN/bin/llvm-ar"
          export RANLIB="$TOOLCHAIN/bin/llvm-ranlib"
          export STRIP="$TOOLCHAIN/bin/llvm-strip"
          export CFLAGS="-O2 -fPIC"

          ./configure \
            --host=arm-linux-androideabi \
            --disable-udev \
            --enable-static \
            --disable-shared

          make -j$(nproc)

          DEST="$ROOT/app/src/main/cpp/libs/armeabi-v7a"
          mkdir -p "$DEST"
          cp libusb/.libs/libusb-1.0.a "$DEST/"
          ls -lh "$DEST/"

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CouchFi-ARMv7
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
